name: reconcile

on:
  schedule:
    - cron: "41 7 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  reconcile:
    permissions:
      contents: read
      actions: write
    uses: Mavergreen/shipyard/.github/workflows/reconcile.yml@v1
    with:
      # spec: as repackage-on-ingredient-bump.yml: shipyard's default (local_release=true) is
      #       ungated in release.yml, so a nightly dispatch landing while a push-triggered release
      #       is still running would cut a second release of the same state
      dispatch-field: reconcile=true
